  <script>

var timer;
var timerStart;
var timeSpentOnSite = getTimeSpentOnSite();

function getTimeSpentOnSite(){
    timeSpentOnSite = parseInt(localStorage.getItem('timeSpentOnSite'));
    timeSpentOnSite = isNaN(timeSpentOnSite) ? 0 : timeSpentOnSite;
    return timeSpentOnSite;
}

function startCounting(){
    timerStart = Date.now();
    timer = setInterval(function(){



        timeSpentOnSite = getTimeSpentOnSite()+(Date.now()-timerStart);
        localStorage.setItem('timeSpentOnSite',timeSpentOnSite);
        timerStart = parseInt(Date.now());
        console.log(parseInt(timeSpentOnSite/1000));
        if(parseInt(timeSpentOnSite/1000) >= 10){
            timeSpentOnSite = 0;
            localStorage.setItem('timeSpentOnSite', timeSpentOnSite);
            element.classList.add("myClass1");

}
startCounting();

function start() {
  document.getElementById("img1").classList.toggle("play-animation");
  document.getElementById("img2").classList.toggle("play-animation");
}

function stop() {
  document.getElementById("img1").classList.toggle("stop-animation");
  document.getElementById("img2").classList.toggle("stop-animation");
}


function highlight(text) {
  var inputText = document.getElementById("inputText");
  var innerHTML = inputText.innerHTML;
  var index = innerHTML.indexOf(text);
  if (index >= 0) {
   innerHTML = innerHTML.substring(0,index) + "<span class='highlight'>" + innerHTML.substring(index,index+text.length) + "</span>" + innerHTML.substring(index + text.length);
   inputText.innerHTML = innerHTML;
  }
}
